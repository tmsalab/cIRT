<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600" role="img" aria-labelledby="cirtlTitle cirtlDesc">
<title id="cirtlTitle">cIRT</title>
<desc id="cirtlDesc">Hexagonal logo for the R package cIRT. Two playing cards stand on a solid table with the word cIRT cut out of it. The left card, drawn in outline, shows 6, the points for the easy item. The right card, solid, shows 16, the points for the hard item; the examinee chose it, so it is lifted off the table above a dashed outline of where it stood. On its face, rising from a wire near its foot, is an orange posterior density for the examinee's ability theta, with a dashed normal prior arching low across it and a dot at the median on a short thick bar.</desc>
